# Verificação automática do SyncTasks: roda a cada envio de código.
# O Render só publica a versão nova quando esta verificação termina com sucesso (autoDeployTrigger: checksPass no render.yaml).
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Verificação completa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://nerus:nerus@localhost:5432/nerus_test
      E2E_DATABASE_URL: postgres://nerus:nerus@localhost:5432/nerus_e2e
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL que já vem instalado na máquina do GitHub: sem baixar imagem, porque os limites
      # de download do Docker Hub e depois do espelho da AWS derrubavam a verificação.
      - name: Ligar o PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -c "CREATE ROLE nerus LOGIN SUPERUSER PASSWORD 'nerus';"
          for db in nerus nerus_test nerus_e2e; do sudo -u postgres createdb -O nerus "$db"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Conferir tipos (typecheck)
        run: npm run typecheck
      - name: Testes da API, permissões, regras e uso caótico
        run: npm test
      - name: Compilar o app
        run: npm run build
      - name: Instalar o navegador dos roteiros de tela
        run: npx playwright install --with-deps chromium
      - name: Roteiros de tela (computador e celular)
        run: npm run test:telas
      - name: Guardar fotos e relatório se algum roteiro falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roteiros-de-tela
          path: |
            e2e/resultados/
            e2e/relatorio/
          retention-days: 14

  carga:
    # Teste de carga: só sob demanda (aba Actions > Testes > Run workflow), porque é demorado.
    name: Teste de carga (sob demanda)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL que já vem instalado na máquina do GitHub: sem baixar imagem, porque os limites
      # de download do Docker Hub e depois do espelho da AWS derrubavam a verificação.
      - name: Ligar o PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -c "CREATE ROLE nerus LOGIN SUPERUSER PASSWORD 'nerus';"
          for db in nerus nerus_test nerus_e2e; do sudo -u postgres createdb -O nerus "$db"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 100 pessoas ao mesmo tempo por 2 minutos
        run: npm run test:carga
        env:
          CARGA_SEGUNDOS: '120'
