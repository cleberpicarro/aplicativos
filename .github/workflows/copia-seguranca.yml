# Item 97 (revisão geral, R1): cópia de segurança semanal do banco, guardada FORA do Render (no GitHub),
# com a restauração testada toda vez. Roda aos domingos às 3h (Brasília) e também à mão
# (aba Actions > Cópia de segurança > Run workflow).
#
# Precisa de dois segredos do repositório (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  endereço externo do banco no Render (nerus-db > Connect > External Database URL)
#   BACKUP_PASSWORD      senha longa que tranca a cópia (guarde-a num lugar seguro: sem ela a cópia não abre)
# O repositório é público: a cópia sai SEMPRE trancada (gpg, AES-256) e nada dos dados aparece no registro.
name: Cópia de segurança

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia-seguranca
  cancel-in-progress: false

jobs:
  copia:
    name: Copiar, trancar e testar a restauração
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os segredos
        id: segredos
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSWORD" ]; then
            echo "::warning::Cópia de segurança desligada: faltam os segredos BACKUP_DATABASE_URL e BACKUP_PASSWORD (veja o README, seção Cópia de segurança)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Copiar o banco e testar a restauração
        if: steps.segredos.outputs.ok == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: bash scripts/copia-seguranca.sh
      - name: Guardar a cópia trancada (90 dias)
        if: steps.segredos.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: copia-synctasks-${{ github.run_number }}
          path: copia/*.gpg
          retention-days: 90
          compression-level: 0
