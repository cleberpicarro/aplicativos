# Desenvolvimento local: PostgreSQL + Mailpit (caixa de e-mail de teste em http://localhost:8025).
# Para subir também o app compilado: docker compose --profile app up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nerus
      POSTGRES_PASSWORD: nerus
      POSTGRES_DB: nerus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mail:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  app:
    profiles: [app]
    build: .
    depends_on: [db, mail]
    environment:
      DATABASE_URL: postgres://nerus:nerus@db:5432/nerus
      APP_URL: http://localhost:3000
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      MAIL_FROM: Nerus Tasks <tarefas@localhost>
    ports: ["3000:3000"]
volumes:
  pgdata:
